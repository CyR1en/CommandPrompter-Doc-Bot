# Builds and publishes the ref0 application and pinned Pi capsule images to GHCR.
#
# Publishes edge images on main, release images on v* tags, and images on
# manual dispatch. Both application and capsule builds require verification.
#
# All builds are multi-arch (linux/amd64, linux/arm64) and ship with
# provenance + SPDX SBOM.

name: docker-publish

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version tag (e.g. 1.2.0). Leave blank for a SHA-only build."
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ref0

# Cancel any in-flight run for the same tag — saves runner minutes when
# a maintainer force-pushes a release tag.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-context:
    name: Validate release context
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch for manual publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = "refs/heads/$DEFAULT_BRANCH"

  verify:
    name: Verify release candidate
    needs: release-context
    uses: ./.github/workflows/verify.yml

  build-and-push:
    name: Build & push
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: write  # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Derive image tags and labels from the pushed Git tag via the
      # official metadata action. Outputs:
      #   tags    — semver-cleaned version tags
      #   labels  — org.opencontainers.image.* labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # ``flavor: latest=auto`` makes ``latest`` apply automatically,
          # but only for non-prerelease tags (e.g. v1.2.3 → latest,
          # v1.2.3-rc.1 → no ``latest`` tag).
          flavor: latest=auto
          tags: |
            # Manual release with an explicit version wins over auto-derived tags.
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=edge,enable={{is_default_branch}}

      # QEMU + buildx are required for cross-platform images.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # GitHub-native layer cache. Falls back to registry cache when the
      # GHCR image doesn't exist yet (e.g. first build).
      - name: Cache Docker layers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain hardening: SLSA-style provenance + SPDX SBOM.
          provenance: mode=max
          sbom: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          # Strip the .venv and data/ directories — .dockerignore already
          # excludes them, but being explicit guards against future edits.
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Move buildx cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  build-and-push-capsule:
    name: Build & push Pi capsule
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract capsule Docker metadata
        id: capsule-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=pi-0.84.4-r9-${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{version}},prefix=pi-0.84.4-r9-
            type=sha,format=short,prefix=pi-0.84.4-r9-
            type=raw,value=pi-0.84.4-r9-edge,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the networkless capsule
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./capsule/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.capsule-meta.outputs.tags }}
          labels: ${{ steps.capsule-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
